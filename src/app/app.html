<mat-sidenav-container class="app-container">

  <mat-sidenav class="app-sidenav" mode="side" [opened]="sidenavOpened()">
    <app-navbar />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <app-header [pageTitle]="pageTitle" (menuToggle)="toggleSidenav()" />

    <main class="app-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>

</mat-sidenav-container>
