<div class="panel">
    <h3 class="panel__title">List years with multiple winners</h3>

    @if(loading()) {
        <div class="panel__spinner">
            <mat-spinner diameter="30"></mat-spinner>
        </div>
    } @else {
        <table class="panel__table" mat-table [dataSource]="data()">
            <ng-container matColumnDef="year">
                <th mat-header-cell *matHeaderCellDef>Year</th>
                <td mat-cell *matCellDef="let row">{{ row.year }}</td>
            </ng-container>

            <ng-container matColumnDef="winnerCount">
                <th mat-header-cell *matHeaderCellDef>Win Count</th>
                <td mat-cell *matCellDef="let row">{{ row.winnerCount }}</td>
            </ng-container>''

            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
    }
</div>
