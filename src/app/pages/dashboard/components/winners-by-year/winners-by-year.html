<div class="panel">
    <h3 class="panel__title">List movie winners by year</h3>

    <div class="panel__search">
        <mat-form-field appearance="outline" class="panel__search-input">
            <mat-label>Search by year</mat-label>
            <input matInput placeholder="Ex.: 2026" [(ngModel)]="searchYear" (keyup.enter)="search()" type="number">
        </mat-form-field>

        <button mat-icon-button color="primary" (click)="search()">
            <mat-icon>search</mat-icon>
        </button>
    </div>

    @if(loading()) {
        <div class="panel__spinner">
            <mat-spinner diameter="30"></mat-spinner>
        </div>
    } @else {
        <table mat-table [dataSource]="data()" class="panel__table">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>Id</th>
                <td mat-cell *matCellDef="let row">{{ row.id }}</td>
            </ng-container>
        
            <ng-container matColumnDef="year">
                <th mat-header-cell *matHeaderCellDef>Year</th>
                <td mat-cell *matCellDef="let row">{{ row.year }}</td>
            </ng-container>
        
            <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef>Title</th>
                <td mat-cell *matCellDef="let row">{{ row.title }}</td>
            </ng-container>
        
            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
    }
</div>
