<div class="panel">
    <h3 class="panel__title">Top 3 studios with winners</h3>

    @if(loading()) {
        <div class="panel__spinner">
            <mat-spinner diameter="30"></mat-spinner>
        </div>
    } @else {
        <table class="panel__table" mat-table [dataSource]="data()">
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <ng-container matColumnDef="winCount">
                <th mat-header-cell *matHeaderCellDef>Win Count</th>
                <td mat-cell *matCellDef="let row">{{ row.winCount }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
    }
</div>
